name: Generate CNC Layout SVG

on:
  push:
    branches: [ main, master ]
    paths: 
      - 'v2509P/~CNCLAYOUT.scad'
      - 'v2509P/~CNCLAYOUT05.scad'
      - 'v2509P/~CNCLAYOUT0125.scad'
      - 'v2509P/*.scad'
  pull_request:
    branches: [ main, master ]
    paths: 
      - 'v2509P/~CNCLAYOUT.scad'
      - 'v2509P/~CNCLAYOUT05.scad'
      - 'v2509P/~CNCLAYOUT0125.scad'
      - 'v2509P/*.scad'
  workflow_dispatch:

jobs:
  generate-svg:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref_name }}
    
    - name: Install OpenSCAD
      run: |
        sudo apt-get update
        sudo apt-get install -y openscad xvfb
    
    - name: Generate SVG from CNCLAYOUT.scad (all parts)
      run: |
        cd v2509P
        # Use xvfb-run to provide a virtual display for OpenSCAD rendering
        # For 2D projections, use top-down orthographic view
        xvfb-run -a openscad --render --imgsize=2048,1536 --colorscheme=Tomorrow --projection=ortho --camera=0,0,0,0,0,0,1000 -o cnclayout.svg ~CNCLAYOUT.scad
        
        # Verify the SVG was created
        if [ -f cnclayout.svg ]; then
          echo "✅ CNC Layout SVG generated successfully"
          ls -la cnclayout.svg
          # Show file size for reference
          du -h cnclayout.svg
        else
          echo "❌ Failed to generate CNC Layout SVG"
          exit 1
        fi
    
    - name: Generate SVG from CNCLAYOUT05.scad (0.5" thickness)
      run: |
        cd v2509P
        xvfb-run -a openscad --render --imgsize=2048,1536 --colorscheme=Tomorrow --projection=ortho --camera=0,0,0,0,0,0,1000 -o cnclayout05.svg ~CNCLAYOUT05.scad
        
        if [ -f cnclayout05.svg ]; then
          echo '✅ CNC Layout 0.5" SVG generated successfully'
          ls -la cnclayout05.svg
          du -h cnclayout05.svg
        else
          echo '❌ Failed to generate CNC Layout 0.5" SVG'
          exit 1
        fi
    
    - name: Generate SVG from CNCLAYOUT0125.scad (0.125" thickness)
      run: |
        cd v2509P
        xvfb-run -a openscad --render --imgsize=2048,1536 --colorscheme=Tomorrow --projection=ortho --camera=0,0,0,0,0,0,1000 -o cnclayout0125.svg ~CNCLAYOUT0125.scad
        
        if [ -f cnclayout0125.svg ]; then
          echo '✅ CNC Layout 0.125" SVG generated successfully'
          ls -la cnclayout0125.svg
          du -h cnclayout0125.svg
        else
          echo '❌ Failed to generate CNC Layout 0.125" SVG'
          exit 1
        fi
    
    - name: Update README with CNC layout SVGs
      run: |
        # Check if the CNC layout SVG references already exist in README
        if ! grep -q "cnclayout.svg" README.md; then
          echo "Adding CNC layout SVGs to README..."
          
          # Create the content to add
          README_CONTENT="\\n## CNC Cutting Layouts\\n\\n"
          README_CONTENT+="### All Parts\\n"
          README_CONTENT+="![CNC Cutting Layout - All Parts](v2509P/cnclayout.svg)\\n\\n"
          README_CONTENT+="### 0.5\" Thickness (Drawer, Frame, Arm Parts)\\n"
          README_CONTENT+="![CNC Cutting Layout - 0.5\" Thickness](v2509P/cnclayout05.svg)\\n\\n"
          README_CONTENT+="### 0.125\" Thickness (Guard/Hopper Parts)\\n"
          README_CONTENT+="![CNC Cutting Layout - 0.125\" Thickness](v2509P/cnclayout0125.svg)\\n"
          
          # Add the CNC layout SVGs after the assembly image with proper spacing
          if grep -q "assembly.png" README.md; then
            # Add after the assembly image
            sed -i "/assembly.png/a\\${README_CONTENT}" README.md
          else
            # Add after the title if no assembly image exists
            sed -i "/# Compressed Earth Block Press/a\\${README_CONTENT}" README.md
          fi
          echo "✅ README updated with CNC layout SVGs"
        else
          echo "ℹ️  CNC layout SVG already referenced in README"
        fi
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add v2509P/cnclayout.svg v2509P/cnclayout05.svg v2509P/cnclayout0125.svg README.md || true
        
        # Check if there are any changes to commit
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit"
        else
          echo "📝 Committing changes..."
          git commit -m "Update CNC layout SVGs and README [skip ci]"
          git push
          echo "✅ Changes pushed successfully"
        fi